---
name: Unit Tests

# Fork-only: runs the standalone unit test setup (jest.unit.config.ts).
# No secrets, no database, no services.

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'apps/docs/**'
  push:
    branches:
      - 'nlw/**'
      - 'custom/nextlevelweb'
    paths-ignore:
      - '**/*.md'
      - 'apps/docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit
