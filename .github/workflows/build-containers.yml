---
name: "Build Containers"

permissions:
  contents: read
  packages: write

# Images are published only for NLW tags. An exact image tag never moves
# :latest unless it is a stable nlw-vX.Y.Z release; pre-release and snapshot
# tags (nlw-v1.1.0-rc.1, nlw-pre-...) publish their exact tag only. Upstream
# tags (v2.25.0) never build here
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing nlw-* git tag to build and publish (no "/")'
        required: true
        type: string
      latest:
        description: 'Also move :latest (stable nlw-vX.Y.Z tags only)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'nlw-*'

jobs:
  build-containers-common:
    runs-on: ubuntu-latest
    outputs:
      containerver: ${{ steps.getcontainerver.outputs.containerver }}
      latest: ${{ steps.getcontainerver.outputs.latest }}
      sha: ${{ steps.getsha.outputs.sha }}
    steps:
      - name: Get Container Version
        id: getcontainerver
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LATEST: ${{ inputs.latest }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            containerver="$INPUT_TAG"
          else
            containerver="$REF_NAME"
          fi

          # an nlw-* name that is also a valid Docker tag, so never a branch
          if ! [[ "$containerver" =~ ^nlw-[A-Za-z0-9_.-]{1,124}$ ]]; then
            echo "::error::Image tag '$containerver' must start with nlw- and be a valid Docker tag"
            exit 1
          fi

          stable=false
          if [[ "$containerver" =~ ^nlw-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            stable=true
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            latest="$INPUT_LATEST"
            if [ "$latest" = "true" ] && [ "$stable" != "true" ]; then
              echo "::error::Only a stable nlw-vX.Y.Z tag can move :latest"
              exit 1
            fi
          else
            latest="$stable"
          fi
          if [ "$latest" != "true" ]; then
            latest=false
          fi

          echo "containerver=$containerver" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      # the image is always built from the git tag it is named after
      - name: Checkout Tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.getcontainerver.outputs.containerver }}

      - name: Get Tag Commit
        id: getsha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-containers:
    needs: build-containers-common
    strategy:
      matrix:
        include:
          - runnertags: ubuntu-latest
            arch: amd64
          - runnertags: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runnertags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-containers-common.outputs.sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        env:
          CONTAINERVER: ${{ needs.build-containers-common.outputs.containerver }}
          NEXT_PUBLIC_VERSION: ${{ needs.build-containers-common.outputs.containerver }}
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            -f Dockerfile.dev \
            -t "ghcr.io/nextlevelweb/postiz-app:$CONTAINERVER-${{ matrix.arch }}" \
            --build-arg NEXT_PUBLIC_VERSION="$NEXT_PUBLIC_VERSION" \
            --build-arg NEXT_PUBLIC_BRAND_NAME="${{ vars.NEXT_PUBLIC_BRAND_NAME }}" \
            --build-arg NEXT_PUBLIC_BRAND_SHORT_NAME="${{ vars.NEXT_PUBLIC_BRAND_SHORT_NAME }}" \
            --build-arg NEXT_PUBLIC_BRAND_LOGO_URL="${{ vars.NEXT_PUBLIC_BRAND_LOGO_URL }}" \
            --build-arg NEXT_PUBLIC_BRAND_LOGO_TEXT_URL="${{ vars.NEXT_PUBLIC_BRAND_LOGO_TEXT_URL }}" \
            --build-arg NEXT_PUBLIC_BRAND_FAVICON_URL="${{ vars.NEXT_PUBLIC_BRAND_FAVICON_URL }}" \
            --build-arg NEXT_PUBLIC_BRAND_PRIMARY_COLOR="${{ vars.NEXT_PUBLIC_BRAND_PRIMARY_COLOR }}" \
            --build-arg NEXT_PUBLIC_BRAND_SECONDARY_COLOR="${{ vars.NEXT_PUBLIC_BRAND_SECONDARY_COLOR }}" \
            --build-arg NEXT_PUBLIC_BRAND_ACCENT_COLOR="${{ vars.NEXT_PUBLIC_BRAND_ACCENT_COLOR }}" \
            --build-arg NEXT_PUBLIC_BRAND_TEXT_DARK="${{ vars.NEXT_PUBLIC_BRAND_TEXT_DARK }}" \
            --build-arg NEXT_PUBLIC_BRAND_TEXT_LIGHT="${{ vars.NEXT_PUBLIC_BRAND_TEXT_LIGHT }}" \
            --build-arg NEXT_PUBLIC_BRAND_GRADIENT_START="${{ vars.NEXT_PUBLIC_BRAND_GRADIENT_START }}" \
            --build-arg NEXT_PUBLIC_BRAND_GRADIENT_END="${{ vars.NEXT_PUBLIC_BRAND_GRADIENT_END }}" \
            --build-arg NEXT_PUBLIC_BRAND_WEBSITE_URL="${{ vars.NEXT_PUBLIC_BRAND_WEBSITE_URL }}" \
            --build-arg NEXT_PUBLIC_BRAND_SUPPORT_URL="${{ vars.NEXT_PUBLIC_BRAND_SUPPORT_URL }}" \
            --build-arg NEXT_PUBLIC_BRAND_TERMS_URL="${{ vars.NEXT_PUBLIC_BRAND_TERMS_URL }}" \
            --build-arg NEXT_PUBLIC_BRAND_PRIVACY_URL="${{ vars.NEXT_PUBLIC_BRAND_PRIVACY_URL }}" \
            --build-arg NEXT_PUBLIC_BRAND_AUTH_HEADLINE="${{ vars.NEXT_PUBLIC_BRAND_AUTH_HEADLINE }}" \
            --build-arg NEXT_PUBLIC_BRAND_AUTH_STAT="${{ vars.NEXT_PUBLIC_BRAND_AUTH_STAT }}" \
            --build-arg NEXT_PUBLIC_BRAND_APP_TITLE="${{ vars.NEXT_PUBLIC_BRAND_APP_TITLE }}" \
            --pull \
            --no-cache \
            --provenance=false --sbom=false \
            --output "type=registry,name=ghcr.io/nextlevelweb/postiz-app:$CONTAINERVER-${{ matrix.arch }}" .

  build-container-manifest:
    needs: [build-containers, build-containers-common]
    runs-on: ubuntu-latest
    steps:
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create Docker Manifest
        env:
          CONTAINERVER: ${{ needs.build-containers-common.outputs.containerver }}
        run: |
          # Verify the architecture images
          echo "Verifying AMD64 image:"
          docker buildx imagetools inspect "ghcr.io/nextlevelweb/postiz-app:$CONTAINERVER-amd64"

          echo "Verifying ARM64 image:"
          docker buildx imagetools inspect "ghcr.io/nextlevelweb/postiz-app:$CONTAINERVER-arm64"

          # Try to remove any existing manifest first
          docker manifest rm "ghcr.io/nextlevelweb/postiz-app:$CONTAINERVER" || true

          # Create and push the version-specific manifest
          docker manifest create "ghcr.io/nextlevelweb/postiz-app:$CONTAINERVER" \
            --amend "ghcr.io/nextlevelweb/postiz-app:$CONTAINERVER-amd64" \
            --amend "ghcr.io/nextlevelweb/postiz-app:$CONTAINERVER-arm64"

          docker manifest push "ghcr.io/nextlevelweb/postiz-app:$CONTAINERVER"

      - name: Verify Manifest
        env:
          CONTAINERVER: ${{ needs.build-containers-common.outputs.containerver }}
        run: |
          docker manifest inspect "ghcr.io/nextlevelweb/postiz-app:$CONTAINERVER"

      # only a stable nlw-vX.Y.Z release moves :latest, after its own manifest
      - name: Create Latest Manifest
        if: needs.build-containers-common.outputs.latest == 'true'
        env:
          CONTAINERVER: ${{ needs.build-containers-common.outputs.containerver }}
        run: |
          docker manifest rm ghcr.io/nextlevelweb/postiz-app:latest || true

          docker manifest create ghcr.io/nextlevelweb/postiz-app:latest \
            --amend "ghcr.io/nextlevelweb/postiz-app:$CONTAINERVER-amd64" \
            --amend "ghcr.io/nextlevelweb/postiz-app:$CONTAINERVER-arm64"

          docker manifest push ghcr.io/nextlevelweb/postiz-app:latest

          docker manifest inspect ghcr.io/nextlevelweb/postiz-app:latest
