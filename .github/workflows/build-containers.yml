---
name: "Build Containers"

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-containers-common:
    runs-on: ubuntu-latest
    outputs:
      containerver: ${{ steps.getcontainerver.outputs.containerver }}
    steps:
      - name: Get Container Version
        id: getcontainerver
        run: |
          echo "containerver=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

  build-containers:
    needs: build-containers-common
    strategy:
      matrix:
        include:
          - runnertags: ubuntu-latest
            arch: amd64
          - runnertags: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runnertags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        env:
          CONTAINERVER: ${{ needs.build-containers-common.outputs.containerver }}
          NEXT_PUBLIC_VERSION: ${{ github.ref_name }}
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            -f Dockerfile.dev \
            -t ghcr.io/nextlevelweb/postiz-app:${{ env.CONTAINERVER }}-${{ matrix.arch }} \
            --build-arg NEXT_PUBLIC_VERSION=${{ env.NEXT_PUBLIC_VERSION }} \
            --build-arg NEXT_PUBLIC_BRAND_NAME="${{ vars.NEXT_PUBLIC_BRAND_NAME }}" \
            --build-arg NEXT_PUBLIC_BRAND_SHORT_NAME="${{ vars.NEXT_PUBLIC_BRAND_SHORT_NAME }}" \
            --build-arg NEXT_PUBLIC_BRAND_LOGO_URL="${{ vars.NEXT_PUBLIC_BRAND_LOGO_URL }}" \
            --build-arg NEXT_PUBLIC_BRAND_LOGO_TEXT_URL="${{ vars.NEXT_PUBLIC_BRAND_LOGO_TEXT_URL }}" \
            --build-arg NEXT_PUBLIC_BRAND_FAVICON_URL="${{ vars.NEXT_PUBLIC_BRAND_FAVICON_URL }}" \
            --build-arg NEXT_PUBLIC_BRAND_PRIMARY_COLOR="${{ vars.NEXT_PUBLIC_BRAND_PRIMARY_COLOR }}" \
            --build-arg NEXT_PUBLIC_BRAND_SECONDARY_COLOR="${{ vars.NEXT_PUBLIC_BRAND_SECONDARY_COLOR }}" \
            --build-arg NEXT_PUBLIC_BRAND_ACCENT_COLOR="${{ vars.NEXT_PUBLIC_BRAND_ACCENT_COLOR }}" \
            --build-arg NEXT_PUBLIC_BRAND_TEXT_DARK="${{ vars.NEXT_PUBLIC_BRAND_TEXT_DARK }}" \
            --build-arg NEXT_PUBLIC_BRAND_TEXT_LIGHT="${{ vars.NEXT_PUBLIC_BRAND_TEXT_LIGHT }}" \
            --build-arg NEXT_PUBLIC_BRAND_GRADIENT_START="${{ vars.NEXT_PUBLIC_BRAND_GRADIENT_START }}" \
            --build-arg NEXT_PUBLIC_BRAND_GRADIENT_END="${{ vars.NEXT_PUBLIC_BRAND_GRADIENT_END }}" \
            --build-arg NEXT_PUBLIC_BRAND_WEBSITE_URL="${{ vars.NEXT_PUBLIC_BRAND_WEBSITE_URL }}" \
            --build-arg NEXT_PUBLIC_BRAND_SUPPORT_URL="${{ vars.NEXT_PUBLIC_BRAND_SUPPORT_URL }}" \
            --build-arg NEXT_PUBLIC_BRAND_TERMS_URL="${{ vars.NEXT_PUBLIC_BRAND_TERMS_URL }}" \
            --build-arg NEXT_PUBLIC_BRAND_PRIVACY_URL="${{ vars.NEXT_PUBLIC_BRAND_PRIVACY_URL }}" \
            --build-arg NEXT_PUBLIC_BRAND_AUTH_HEADLINE="${{ vars.NEXT_PUBLIC_BRAND_AUTH_HEADLINE }}" \
            --build-arg NEXT_PUBLIC_BRAND_AUTH_STAT="${{ vars.NEXT_PUBLIC_BRAND_AUTH_STAT }}" \
            --build-arg NEXT_PUBLIC_BRAND_APP_TITLE="${{ vars.NEXT_PUBLIC_BRAND_APP_TITLE }}" \
            --pull \
            --no-cache \
            --provenance=false --sbom=false \
            --output "type=registry,name=ghcr.io/nextlevelweb/postiz-app:${{ env.CONTAINERVER }}-${{ matrix.arch }}" .

  build-container-manifest:
    needs: [build-containers, build-containers-common]
    runs-on: ubuntu-latest
    steps:
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create Docker Manifest
        env:
          CONTAINERVER: ${{ needs.build-containers-common.outputs.containerver }}
        run: |
          # Verify the architecture images
          echo "Verifying AMD64 image:"
          docker buildx imagetools inspect ghcr.io/nextlevelweb/postiz-app:${{ env.CONTAINERVER }}-amd64
          
          echo "Verifying ARM64 image:"
          docker buildx imagetools inspect ghcr.io/nextlevelweb/postiz-app:${{ env.CONTAINERVER }}-arm64
          
          # Try to remove any existing manifests first
          docker manifest rm ghcr.io/nextlevelweb/postiz-app:${{ env.CONTAINERVER }} || true
          docker manifest rm ghcr.io/nextlevelweb/postiz-app:latest || true
          
          # Create and push the version-specific manifest
          docker manifest create ghcr.io/nextlevelweb/postiz-app:${{ env.CONTAINERVER }} \
            --amend ghcr.io/nextlevelweb/postiz-app:${{ env.CONTAINERVER }}-amd64 \
            --amend ghcr.io/nextlevelweb/postiz-app:${{ env.CONTAINERVER }}-arm64

          docker manifest push ghcr.io/nextlevelweb/postiz-app:${{ env.CONTAINERVER }}

          # Create and push the latest manifest
          docker manifest create ghcr.io/nextlevelweb/postiz-app:latest \
            --amend ghcr.io/nextlevelweb/postiz-app:${{ env.CONTAINERVER }}-amd64 \
            --amend ghcr.io/nextlevelweb/postiz-app:${{ env.CONTAINERVER }}-arm64

          docker manifest push ghcr.io/nextlevelweb/postiz-app:latest

      - name: Verify Manifest
        run: |
          docker manifest inspect ghcr.io/nextlevelweb/postiz-app:latest
